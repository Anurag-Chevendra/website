<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Manipulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: #222;
            padding: 20px;
            border-bottom: 2px solid #333;
        }

        .title {
            font-size: 2rem;
            color: #00ff00;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 600px;
        }

        .input-section {
            padding: 20px;
            border-right: 2px solid #333;
            background: #1a1a1a;
        }

        .output-section {
            padding: 20px;
            background: #151515;
        }

        .section-title {
            color: #00ff00;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-area {
            width: 100%;
            height: 200px;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 4px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-area:focus {
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .input-area::placeholder {
            color: #555;
        }

        .controls {
            margin: 20px 0;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            display: block;
            color: #00ff00;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: #0a0a0a;
            border: 2px solid #333;
            color: #00ff00;
            padding: 12px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 255, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .output-area {
            width: 100%;
            height: 300px;
            background: #0a0a0a;
            border: 2px solid #333;
            border-radius: 4px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            font-size: 14px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .stats {
            background: #222;
            border: 2px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-top: 15px;
        }

        .stats-title {
            color: #00ff00;
            font-size: 1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #00ff00;
        }

        .input-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .number-input {
            background: #0a0a0a;
            border: 2px solid #333;
            color: #00ff00;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        .number-input:focus {
            border-color: #00ff00;
        }

        .copy-btn {
            background: #0a0a0a;
            border: 2px solid #333;
            color: #00ff00;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .input-section {
                border-right: none;
                border-bottom: 2px solid #333;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">String Manipulator</h1>
            <p class="subtitle">Terminal-style string processing tool</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">Input</h2>
                <textarea 
                    class="input-area" 
                    id="inputText" 
                    placeholder="Enter your text here..."
                    oninput="updateStats()"
                ></textarea>

                <div class="controls">
                    <div class="control-group">
                        <div class="input-controls">
                            <input type="number" class="number-input" id="startIndex" placeholder="Start Index" value="0">
                            <input type="number" class="number-input" id="endIndex" placeholder="End Index" value="10">
                        </div>
                    </div>

                    <div class="control-buttons">
                        <button class="btn" onclick="toUpperCase()">Upper Case</button>
                        <button class="btn" onclick="toLowerCase()">Lower Case</button>
                        <button class="btn" onclick="capitalizeWords()">Capitalize</button>
                        <button class="btn" onclick="reverseString()">Reverse</button>
                        <button class="btn" onclick="trimString()">Trim</button>
                        <button class="btn" onclick="removeSpaces()">Remove Spaces</button>
                        <button class="btn" onclick="base64Encode()">Base64 Encode</button>
                        <button class="btn" onclick="base64Decode()">Base64 Decode</button>
                        <button class="btn" onclick="urlEncode()">URL Encode</button>
                        <button class="btn" onclick="urlDecode()">URL Decode</button>
                        <button class="btn" onclick="extractSubstring()">Substring</button>
                        <button class="btn" onclick="countWords()">Count Words</button>
                        <button class="btn" onclick="removeDuplicates()">Remove Duplicates</button>
                        <button class="btn" onclick="sortLines()">Sort Lines</button>
                        <button class="btn" onclick="shuffleLines()">Shuffle Lines</button>
                        <button class="btn" onclick="addLineNumbers()">Add Line Numbers</button>
                    </div>
                </div>

                <div class="stats">
                    <div class="stats-title">Statistics</div>
                    <div class="stat-item">
                        <span class="stat-label">Characters:</span>
                        <span class="stat-value" id="charCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Words:</span>
                        <span class="stat-value" id="wordCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Lines:</span>
                        <span class="stat-value" id="lineCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Sentences:</span>
                        <span class="stat-value" id="sentenceCount">0</span>
                    </div>
                </div>
            </div>

            <div class="output-section">
                <h2 class="section-title">Output</h2>
                <div class="output-area" id="outputText"></div>
                <button class="copy-btn" onclick="copyOutput()">Copy Output</button>
            </div>
        </div>
    </div>

    <script>
        function getInputText() {
            return document.getElementById('inputText').value;
        }

        function setOutput(text) {
            document.getElementById('outputText').textContent = text;
        }

        function toUpperCase() {
            setOutput(getInputText().toUpperCase());
        }

        function toLowerCase() {
            setOutput(getInputText().toLowerCase());
        }

        function capitalizeWords() {
            const text = getInputText();
            const result = text.replace(/\w\S*/g, (txt) => 
                txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()
            );
            setOutput(result);
        }

        function reverseString() {
            setOutput(getInputText().split('').reverse().join(''));
        }

        function trimString() {
            setOutput(getInputText().trim());
        }

        function removeSpaces() {
            setOutput(getInputText().replace(/\s+/g, ''));
        }

        function base64Encode() {
            try {
                setOutput(btoa(getInputText()));
            } catch (e) {
                setOutput('Error: Unable to encode to Base64');
            }
        }

        function base64Decode() {
            try {
                setOutput(atob(getInputText()));
            } catch (e) {
                setOutput('Error: Invalid Base64 string');
            }
        }

        function urlEncode() {
            setOutput(encodeURIComponent(getInputText()));
        }

        function urlDecode() {
            try {
                setOutput(decodeURIComponent(getInputText()));
            } catch (e) {
                setOutput('Error: Invalid URL encoded string');
            }
        }

        function extractSubstring() {
            const text = getInputText();
            const start = parseInt(document.getElementById('startIndex').value) || 0;
            const end = parseInt(document.getElementById('endIndex').value) || text.length;
            setOutput(text.substring(start, end));
        }

        function countWords() {
            const text = getInputText();
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            const wordCount = {};
            
            words.forEach(word => {
                const cleanWord = word.toLowerCase().replace(/[^\w]/g, '');
                wordCount[cleanWord] = (wordCount[cleanWord] || 0) + 1;
            });

            let result = 'Word Frequency:\n\n';
            Object.entries(wordCount)
                .sort((a, b) => b[1] - a[1])
                .forEach(([word, count]) => {
                    result += `${word}: ${count}\n`;
                });

            setOutput(result);
        }

        function removeDuplicates() {
            const lines = getInputText().split('\n');
            const unique = [...new Set(lines)];
            setOutput(unique.join('\n'));
        }

        function sortLines() {
            const lines = getInputText().split('\n');
            const sorted = lines.sort();
            setOutput(sorted.join('\n'));
        }

        function shuffleLines() {
            const lines = getInputText().split('\n');
            for (let i = lines.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [lines[i], lines[j]] = [lines[j], lines[i]];
            }
            setOutput(lines.join('\n'));
        }

        function addLineNumbers() {
            const lines = getInputText().split('\n');
            const numbered = lines.map((line, index) => `${index + 1}. ${line}`);
            setOutput(numbered.join('\n'));
        }

        function updateStats() {
            const text = getInputText();
            const charCount = text.length;
            const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
            const lineCount = text ? text.split('\n').length : 0;
            const sentenceCount = text ? text.split(/[.!?]+/).filter(s => s.trim().length > 0).length : 0;

            document.getElementById('charCount').textContent = charCount;
            document.getElementById('wordCount').textContent = wordCount;
            document.getElementById('lineCount').textContent = lineCount;
            document.getElementById('sentenceCount').textContent = sentenceCount;
        }

        function copyOutput() {
            const output = document.getElementById('outputText').textContent;
            navigator.clipboard.writeText(output).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.style.borderColor = '#00ff00';
                btn.style.background = 'rgba(0, 255, 0, 0.2)';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.borderColor = '#333';
                    btn.style.background = '#0a0a0a';
                }, 2000);
            });
        }

        // Initialize stats on page load
        updateStats();
    </script>
</body>
</html>
